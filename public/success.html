<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plaster&family=Poppins:wght@400;600;700&display=swap"
        rel="stylesheet">
    <title>No Skip Records — Order Confirmed</title>
</head>

<body>
    <header>
        <a href="/"><img src="/images/spiral_logo.png" alt="No Skip Records Logo"></a>
        <div class="header-text">
            <h1>No Skip Records</h1>
            <p class="subhead">The needle never skips. Neither do we.</p>
        </div>
    </header>

    <main class="sign-forms">
        <div class="sign-form">
            <div class="form-inner">
                <h2>✅ Order Confirmed</h2>
                <p id="success-message">Your payment went through. Your records are on their way.</p>
                <p id="payment-details"></p>
                <a href="/" class="form-btn" style="text-align:center; display:block; margin-top:1rem;">
                    Keep Shopping
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p>© No Skip Records — built by <a href="https://github.com/SheillaO" target="_blank"
                rel="noopener noreferrer">Sheilla O.</a></p>
    </footer>

    <script type="module">
        const BACKEND_URL = "https://no-skip-records.onrender.com";
        const params = new URLSearchParams(window.location.search);
        const reference = params.get("reference") || params.get("trxref");

        if (reference) {
            // FIXED: uses absolute URL so verify works from Netlify → Render
            fetch(`${BACKEND_URL}/api/payments/verify/${reference}`, { credentials: "include" })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById("payment-details").textContent =
                            `Amount paid: $${data.amount} · Receipt sent to ${data.email}`;
                    }
                })
                .catch(() => {
                    document.getElementById("success-message").textContent =
                        "Payment received. We could not load the details but your order is confirmed.";
                });
        }
    </script>
</body>

</html>
