<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plaster&family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet">
  <title>No Skip Records — Your Basket</title>
</head>

<body>
  <!-- Top Navigation Banner -->
  <div class="top-banner">
    <p id="greeting" class="top-banner-greeting"></p>
    <button class="menu-toggle" aria-label="Toggle menu"><img src="images/menu.svg" alt=""></button>
    <nav class="header-menu" aria-label="Main menu">
      <a href="/login.html" id="login">Log in</a>
      <a href="/signup.html" id="signup">Sign up</a>
      <button class="main-btn" id="logout-btn">Log out</button>
    </nav>
  </div>

  <!-- Main Storefront Branding Header -->
  <header>
    <a href="/"><img src="/images/spiral_logo.png" alt="No Skip Records Logo"></a>
    <div class="header-text">
      <h1>No Skip Records</h1>
      <p class="subhead">The needle never skips. Neither do we.</p>
    </div>
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </header>

  <!-- Interactive E-Commerce Cart Manager View -->
  <main class="cart-main">
    <h2>Your Basket</h2>
    <ul id="cart-list"></ul>
    <p id="cart-total"></p>
    <p id="user-message"></p>
    <button class="main-btn" id="checkout-btn">Checkout</button>
  </main>

  <!-- Footer Component with Secure Context Linking -->
  <footer>
    <p>© No Skip Records — built by <a href="https://github.com/SheillaO" target="_blank"
        rel="noopener noreferrer">Sheilla O.</a></p>
  </footer>

  <!-- Core Layout Scripts -->
  <script src="js/menu.js" type="module"></script>
  <script src="js/cart.js" type="module"></script>
</body>

</html>
